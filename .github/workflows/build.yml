name: Build and Release Swift Browser

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Record build date
        shell: pwsh
        run: |
          node -e "require('fs').writeFileSync('build-info.json', JSON.stringify({builtAt: new Date().toISOString()}))"

      - name: Build and publish Swift Browser
        run: npm run build -- --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
